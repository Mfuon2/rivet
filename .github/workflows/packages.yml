name: Build unsigned release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev libxrandr-dev libxcursor-dev libxinerama-dev
      - name: Install Windows packaging tool
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      - run: python scripts/release.py package --installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivet-unsigned-${{ runner.os }}-${{ runner.arch }}
          path: dist/releases/
          if-no-files-found: error
          retention-days: 14
