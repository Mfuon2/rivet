[workspace]
members = ["crates/rivet-core", "crates/rivet-cli", "crates/rivet-desktop"]
default-members = ["crates/rivet-core", "crates/rivet-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "links", "default_fonts", "glow", "wayland", "x11", "persistence"] }
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "socks"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

